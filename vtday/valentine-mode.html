<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Mode 💕</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #e5678c;
      --purple: #9b59b6;
      --gold: #d4a853;
      --muted: #7a6b70;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cormorant Garamond', serif;
      background: linear-gradient(180deg, #fef1f4, #f3e4ec, #ece4f3);
      color: #1a1215;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Valentine Proposal Screen */
    #proposal-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, #fef1f4, #f3e4ec, #ece4f3);
      z-index: 2000;
      transition: opacity 0.5s ease;
    }
    
    #proposal-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .proposal-hearts {
      font-size: 5rem;
      margin-bottom: 2rem;
      animation: heartbeat 1.5s infinite;
    }
    
    .proposal-question {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    .proposal-subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--muted);
      margin-bottom: 3rem;
      text-align: center;
    }
    
    .proposal-buttons {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 100px; /* Space for the moving button */
    }
    
    .proposal-btn {
      padding: 1.2rem 2.5rem;
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 1.5rem;
      border: none;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      font-weight: 500;
    }
    
    .btn-yes {
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: white;
      z-index: 10;
    }
    
    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 40px rgba(229, 103, 140, 0.4);
    }
    
    .btn-no {
      background: white;
      color: var(--muted);
      border: 2px solid #ddd;
      position: relative;
    }
    
    /* Celebration Layer */
    .celebration {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3000;
    }
    
    .celebration.active {
      display: block;
    }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confettiFall 3s linear forwards;
    }
    
    /* Main Content Screen */
    #days-list-screen {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    
    #days-list-screen.visible {
      display: block;
      opacity: 1;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: white;
      border: 2px solid var(--primary);
      border-radius: 2rem;
      color: var(--primary);
      text-decoration: none;
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      margin-bottom: 2rem;
    }
    
    .back-button:hover {
      background: var(--primary);
      color: white;
      transform: translateX(-5px);
    }
    
    header {
      text-align: center;
      margin-bottom: 3rem;
    }
    
    .page-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 8vw, 5rem);
      background: linear-gradient(135deg, var(--primary), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    
    .day-card {
      background: rgba(252, 247, 248, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(232, 221, 224, 0.5);
      border-radius: 1rem;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 30px -5px rgba(229, 103, 140, 0.25);
      position: relative;
    }
    
    .day-card:hover { transform: translateY(-5px); }
    
    .day-number { font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: var(--primary); }

    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    
    .falling-heart {
      position: absolute;
      bottom: -50px;
      animation: floatUp 8s ease-in-out forwards;
      color: var(--primary);
    }
    
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="proposal-screen">
    <div class="proposal-hearts">💕</div>
    <h1 class="proposal-question">के तिमी मेरो भ्यालेन्टाइन बन्छौ?</h1>
    <p class="proposal-subtitle">Will You Be My Valentine?</p>
    
    <div class="proposal-buttons">
      <button class="proposal-btn btn-yes" onclick="acceptProposal()">
        हुन्छ 💕
      </button>
      <button class="proposal-btn btn-no" id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">
        नाइँ
      </button>
    </div>
    
    <p style="margin-top: 3rem; font-family: 'Noto Sans Devanagari', sans-serif; color: #999; font-size: 1rem;">
      Hint: त्यो "नाइँ" 😏
    </p>
  </div>

  <div class="celebration" id="celebration"></div>

  <div id="days-list-screen">
    <div class="hearts-container" id="hearts-container"></div>
    <div class="container">
      <a href="koikoi.html" class="back-button">← Back to Koi Koi Heart</a>
      <header>
        <div class="header-heart">💕</div>
        <h1 class="page-title">14 Days of Love</h1>
        <p class="subtitle nepali-text">हाम्रो माया, हाम्रो यात्रा</p>
      </header>
      <div class="days-grid" id="days-grid"></div>
      <footer>
        <p>Made with 💕</p>
        <p>Happy Valentine's Week 💕</p>
      </footer>
    </div>
  </div>

  <script>
    let moveCount = 0;
    
    // --- PROPOSAL LOGIC ---
    function moveButton() {
      const btn = document.getElementById('noBtn');
      moveCount++;
      
      if (moveCount > 5) {
        btn.textContent = "ठीक छ, हो भन! 💕";
        btn.style.background = "linear-gradient(135deg, var(--primary), var(--purple))";
        btn.style.color = "white";
        btn.onmouseover = null;
        btn.ontouchstart = null;
        btn.onclick = acceptProposal;
        return;
      }
      
      // Calculate within viewport bounds
      const maxX = window.innerWidth - btn.offsetWidth - 40;
      const maxY = window.innerHeight - btn.offsetHeight - 40;
      
      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));
      
      btn.style.position = 'fixed';
      btn.style.left = randomX + 'px';
      btn.style.top = randomY + 'px';
    }

    function acceptProposal() {
      createCelebration();
      
      setTimeout(() => {
        document.getElementById('proposal-screen').classList.add('hidden');
        const listScreen = document.getElementById('days-list-screen');
        listScreen.style.display = 'block';
        setTimeout(() => listScreen.classList.add('visible'), 50);
        
        renderDays();
        initHearts();
      }, 1500);
    }

    function createCelebration() {
      const celebration = document.getElementById('celebration');
      celebration.classList.add('active');
      const colors = ['#e5678c', '#9b59b6', '#ff69b4', '#ffd700'];
      const emojis = ['💕', '💖', '🌹', '✨', '💝'];
      
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        if(i % 2 === 0) {
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        } else {
            confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            confetti.style.background = "transparent";
            confetti.style.fontSize = "1.5rem";
        }
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        celebration.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }

    // --- DAYS DATA ---
    const DAYS = [
      { number: 1, title: "Rose Day", titleNepali: "गुलाबको दिन", description: "Like a rose blooming in spring, our love began to grow...", icon: "🌹", file: "day1-rose.html", password: "rose" },
      { number: 2, title: "Propose Day", titleNepali: "प्रस्ताव दिन", description: "The day I asked you to be mine forever...", icon: "💍", file: "day2-propose.html", password: "forever" },
      { number: 3, title: "Chocolate Day", titleNepali: "चकलेटको दिन", description: "Life with you is sweeter than any chocolate...", icon: "🍫", file: "day3-chocolate.html", password: "sweet" },
      { number: 4, title: "Teddy Day", titleNepali: "टेडी दिन", description: "You are my comfort in every storm...", icon: "🧸", file: "day4-teddy.html", password: "cuddle" },
      { number: 5, title: "Promise Day", titleNepali: "प्रतिज्ञा दिन", description: "I promise to love you through every season...", icon: "🤝", file: "day5-promise.html", password: "promise" },
      { number: 6, title: "Hug Day", titleNepali: "अंगाल्ने दिन", description: "In your arms, I found my home...", icon: "🤗", file: "day6-hug.html", password: "embrace" },
      { number: 7, title: "Kiss Day", titleNepali: "चुम्बनको दिन", description: "Every kiss tells a story of our love...", icon: "💋", file: "day7-kiss.html", password: "kiss" },
      { number: 8, title: "Valentine's Day", titleNepali: "भ्यालेन्टाइन दिन", description: "The day we celebrate our beautiful love story...", icon: "💝", file: "day8-valentine.html", password: "valentine" },
      { number: 9, title: "Music Day", titleNepali: "संगीत दिन", description: "You are the song my heart always sings...", icon: "🎵", file: "day9-music.html", password: "melody" },
      { number: 10, title: "Photo Day", titleNepali: "तस्बिर दिन", description: "Every moment with you is picture perfect...", icon: "📷", file: "day10-photo.html", password: "memories" },
      { number: 11, title: "Dream Day", titleNepali: "सपना दिन", description: "Dreaming of forever with you...", icon: "✨", file: "day11-dream.html", password: "dreams" },
      { number: 12, title: "Adventure Day", titleNepali: "साहसिक दिन", description: "Every day with you is a new adventure...", icon: "🗺️", file: "day12-adventure.html", password: "journey" },
      { number: 13, title: "Gratitude Day", titleNepali: "कृतज्ञता दिन", description: "Thank you for being my everything...", icon: "🙏", file: "day13-gratitude.html", password: "grateful" },
      { number: 14, title: "Forever Day", titleNepali: "सदाको लागि दिन", description: "This is just the beginning of our forever...", icon: "♾️", file: "day14-forever.html", password: "infinity" }
    ];

    function renderDays() {
      const grid = document.getElementById('days-grid');
      grid.innerHTML = ''; // Clear existing
      DAYS.forEach(day => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.onclick = () => {
          sessionStorage.setItem('dayPassword', day.password);
          window.location.href = day.file;
        };
        card.innerHTML = `
          <span class="locked-icon">🔒</span>
          <span class="day-icon">${day.icon}</span>
          <div class="day-number">Day ${day.number}</div>
          <h3 class="day-title">${day.title}</h3>
          <p class="day-theme">${day.titleNepali}</p>
          <p class="day-description">${day.description}</p>
        `;
        grid.appendChild(card);
      });
    }

    function initHearts() {
      const container = document.getElementById('hearts-container');
      setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'falling-heart';
        heart.textContent = ['💕', '💗', '💖', '❤️'][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (15 + Math.random() * 15) + 'px';
        container.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
      }, 800);
    }
  </script>
</body>
</html>
